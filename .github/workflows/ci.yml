name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable environment
        shell: bash
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "MYSQL_PASSWORD=$(openssl rand -hex 24)" >> .env
          echo "JWT_KEY=$(openssl rand -hex 32)" >> .env
      - name: Build and start API, migrate MySQL
        run: docker compose up -d --build
      - name: Unit and MySQL integration tests
        run: docker compose --profile test run --build --rm tests --logger "trx;LogFileName=tests.trx"
      - name: HTTP smoke
        run: python3 scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v --remove-orphans
